- name: Install irssi
  apt:
    name: irssi
    state: latest
  become: true

- name: Ensure irssi config directory exists
  file:
    state: directory
    path: ~/.irssi
    mode: 0700

- name: Copy over irssi config
  template:
    src: irssi/config.j2
    dest: ~/.irssi/config
    mode: 0640

- name: Copy over irssi default theme
  copy:
    src: irssi/default.theme
    dest: ~/.irssi
    mode: 0640
