- name: Create host alias for jeeves
  lineinfile:
    path: /etc/hosts
    line: '192.168.1.203   jeeves'
    state: present
  become: true

- name: Check if .password-store exists
  stat:
    path: ~/.password-store
  register: password_store_stat

- block:
  - name: Check if jeeves exists as a remote
    shell: git remote
    args:
      chdir: ~/.password-store
    register: git_remote

  - name: Add jeeves as remote
    shell: git remote add jeeves ssh://jim@jeeves/~/git/pass.git
    args:
      chdir: ~/.password-store
    when: "'jeeves' not in git_remote.stdout"

  - name: Set pass git username
    shell: git config --local user.name "{{ansible_user_id}}"
    args:
      chdir: ~/.password-store

  - name: Set pass git email address to reflect hostname
    shell: git config --local user.email "{{ansible_user_id}}@{{inventory_hostname}}"
    args:
      chdir: ~/.password-store

  - name: Ensure .password-store/.extensions exists
    file:
      state: directory
      path: ~/.password-store/.extensions
      mode: '0755'

  - name: Add pass-sync extension
    copy:
      src: "pass_extensions/{{ item }}"
      dest: ~/.password-store/.extensions
      mode: '0755'
    with_items:
      - sync.bash
      - status.bash
      - checkout.bash
      - stash.bash

  - name: Enable pass extensions
    lineinfile:
      path: ~/.bashrc
      line: 'export PASSWORD_STORE_ENABLE_EXTENSIONS="true"'
      state: present

  - name: Add post-commit hook to push password changes to jeeves
    template:
      src: pass_git_hooks/post-commit.jinja
      dest: ~/.password-store/.git/hooks/post-commit
      mode: '0755'

  # TODO
  # On mac, create crontab entries to sync every hour
  # * * * * * cd /Users/stephanieladd/.password-store && /usr/local/bin/git pull jeeves main
  # * * * * * cd /Users/stephanieladd/.password-store && /usr/local/bin/git push jeeves
  #
  # TODO
  # Do the same thing - in that case you can do:
  # PASSWORD_STORE_ENABLE_EXTENSIONS="true"
  # 0 * * * * /usr/bin/pass sync &>/dev/null
  #
  # Is there a way to do the thing I'm doing on Linux systems on Macs?
  when: password_store_stat.stat.exists
