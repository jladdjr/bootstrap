- block:
  - name: Install borg client and docs
    apt:
      name:
        - borgbackup
        - borgbackup-doc
    become: true

  - name: Install backup.sh
    template:
      src: backup.sh.j2
      dest: '~/backup.sh'
      mode: '0700'

  # TODO: Install borg keys (jim/keys/borg) needed to
  #       connect to borg repo on jeeves

  # TODO: Create cron job to run backup.sh

  # Manual Step: On borg server itself, run
  # backup.sh using Synology recurring task:
  # https://knasmueller.net/configuring-cron-jobs-on-a-synology-nas

  when: inventory_hostname == 'revolution'
