- name: Determine if repo has already been created
  stat:
    path: ~/git/awx
  register: repo_dir
  tags: awx

- block:
  - name: Add awx project
    git:
      dest: ~/git/awx
      repo: git@github.com:jladdjr/awx.git
      accept_hostkey: yes
    tags: awx

  - name: Determine which remotes exist
    command: git remote -v
    args:
      chdir: ~/git/awx
    register: git_remote
    tags: awx

  - name: Add remote repo (ansible)
    command: git remote add ansible git@github.com:ansible/awx.git
    args:
      chdir: ~/git/awx
    when: git_remote.stdout.find('ansible') == -1
    tags: awx

  - name: Fetch ansible repo
    command: git fetch ansible
    args:
      chdir: ~/git/awx
    tags: awx
  when: not repo_dir.stat.exists

- name: Make .akit config directory
  file:
    dest: ~/.akit
    state: directory
    mode: 0755

- name: Create projects (scm url) file
  copy:
    src: akit/projects.yml
    dest: ~/.akit/projects.yml
    mode: 0755

- name: Clear existing awx virtualenv
  shell: . /usr/local/bin/virtualenvwrapper.sh && rmvirtualenv awx
  args:
    executable: /bin/bash
  environment:
    VIRTUALENVWRAPPER_PYTHON: /usr/bin/python3.8
  register: venv_list
  tags: awx
  when: recreate_venvs|default(false)

- name: Determine if virtualenv exists
  shell: . /usr/local/bin/virtualenvwrapper.sh && lsvirtualenv -b
  args:
    executable: /bin/bash
  environment:
    VIRTUALENVWRAPPER_PYTHON: /usr/bin/python3.8
  register: venv_list
  tags: awx

- block:
  - name: Create awx virtualenv
    shell: . /usr/local/bin/virtualenvwrapper.sh && mkvirtualenv --python /usr/bin/python3.8 --system-site-packages awx
    args:
      executable: /bin/bash
    environment:
      VIRTUALENVWRAPPER_PYTHON: /usr/bin/python3.8
    tags: awx

  - name: Install venv requirements
    shell: . /usr/local/bin/virtualenvwrapper.sh && workon awx && pip install -U -r requirements/requirements_dev.txt
    args:
      executable: /bin/bash
      chdir: ~/git/awx
    environment:
      VIRTUALENVWRAPPER_PYTHON: /usr/bin/python3.8
    tags: awx

  # TLDR: Running `make docker-compose` fails when using rpm-based ansible instead of pip-installed ansible.
  # The "Render Docker-Compose" task ends up failing with:
  #
  # > Aborting, target uses selinux but python bindings (libselinux-python) aren't installed!
  #
  # An rpm-based Ansible seems like it will use the system `python3`. In my case, this is python3.9
  # Meanwhile, the venv created for awx will use the venv python3 and the site packages for that. For me, this is python3.8.
  # This seems to result in a mismatch where some required libraries are not found.
  - name: Install ansible in venv
    shell: . /usr/local/bin/virtualenvwrapper.sh && workon awx && pip install -U ansible
    args:
      executable: /bin/bash
      chdir: ~/git/awx
    environment:
      VIRTUALENVWRAPPER_PYTHON: /usr/bin/python3.8
    tags: awx

  - name: Install awxkit
    shell: . /usr/local/bin/virtualenvwrapper.sh && workon awx && pip install -U -e awxkit
    args:
      executable: /bin/bash
      chdir: ~/git/awx
    environment:
      VIRTUALENVWRAPPER_PYTHON: /usr/bin/python3.8
    tags: awx

  - name: Create awxkit project file
    copy:
      src: awxkit/dot_awxkit_projects
      dest: ~/.awxkit_projects
      mode: 0755
  when: "'awx' not in venv_list.stdout"

- name: Create awx alias and derez / preload_tower / wipe_instance functions
  blockinfile:
    path: ~/.bashrc
    block: |
      alias a="workon awx; cd ~/git/awx; python --version | head -1; ansible --version | head -1; git br | grep '*'"
      alias ak="workon awx; cd ~/git/awx/awxkit; python --version | head -1; ansible --version | head -1; git br | grep '*'"

      export AWXKIT_BASE_URL='http://127.0.0.1:8013'
      export AWXKIT_PROJECT_FILE="/home/jim/.awxkit_projects"
      export AWXKIT_USER="admin"
      export AWXKIT_USER_PASSWORD="CHANGEME"
      export AWXKIT_CREDENTIAL_FILE="/home/jim/git/aap-qa/config/credentials.yml"

      # Thoroughly remove awx containers, images and ui build artifacts
      derez () {
          # sudo chown -R jim:jim *
          docker rmi quay.io/ansible/receptor:devel
          docker ps --all -q | xargs docker stop
          docker ps --all -q | xargs docker rm
          make docker-clean
          make clean
          make docker-clean-volumes
          docker volume rm -f tools_awx_db
          docker ps --all
          docker images
          docker system prune --volumes -f
      }

      rmdb () {
          docker stop tools_postgres_1
          docker rm tools_postgres_1
      }

      # Clear UI artifacts, rebuild UI
      rebuild_ui () {
          make clean-ui
          make ui-devel
      }

      preload_tower () {
          # admin user already exists on fresh deployment of dev environment
          #docker exec -ti tools_awx_1 bash -c 'awx-manage createsuperuser --username=admin --email=admin@localhost --no-input'
          docker exec -ti tools_awx_1 bash -c 'awx-manage update_password --username=admin --password=CHANGEME'
          docker exec -ti tools_awx_1 bash -c 'awx-manage create_preload_data'
      }

      wipe_instance () {
          docker stop tools_awx_1
          docker rm tools_awx_1
          docker stop tools_postgres_1
          docker rm tools_postgres_1
      }

      alias update_settings='cp awx/settings/local_settings.py.docker_compose awx/settings/local_settings.py'

      alias at="tmux split-window docker exec -it -u 0 tools_awx_1 bash --rcfile '/var/lib/awx/venv/awx/bin/activate'"

      # container convenience aliases
      alias a1='docker exec -it tools_awx_1 bash'
      alias r1='docker exec -it tools_receptor_1 bash'
      alias r2='docker exec -it tools_receptor_2 bash'

      alias a1r='docker exec -it -u 0 tools_awx_1 bash'
      alias r1r='docker exec -it -u 0 tools_receptor_1 bash'
      alias r2r='docker exec -it -u 0 tools_receptor_2 bash'

      alias a1cancel='docker exec tools_awx_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work list -q | xargs -I{} docker exec tools_awx_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work cancel {}'
      alias r1cancel='docker exec tools_receptor_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work list -q | xargs -I{} docker exec tools_receptor_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work cancel {}'
      alias r2cancel='docker exec tools_receptor_2 receptorctl --socket /var/run/awx-receptor/receptor.sock work list -q | xargs -I{} docker exec tools_receptor_2 receptorctl --socket /var/run/awx-receptor/receptor.sock work cancel {}'

      alias a1rel='docker exec tools_awx_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work list -q | xargs -I{} docker exec tools_awx_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work release {}'
      alias r1rel='docker exec tools_receptor_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work list -q | xargs -I{} docker exec tools_receptor_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work release {}'
      alias r2rel='docker exec tools_receptor_2 receptorctl --socket /var/run/awx-receptor/receptor.sock work list -q | xargs -I{} docker exec tools_receptor_2 receptorctl --socket /var/run/awx-receptor/receptor.sock work release {}'

      alias a1stop='docker exec tools_awx_1 podman ps -q | xargs -I{} docker exec tools_awx_1 podman stop {}'
      alias r1stop='docker exec tools_receptor_1 podman ps -q | xargs -I{} docker exec tools_receptor_1 podman stop {}'
      alias r2stop='docker exec tools_receptor_2 podman ps -q | xargs -I{} docker exec tools_receptor_2 podman stop {}'

      prep_containers () {
          SET_PS1_AWX1='/usr/bin/echo "export PS1=\"awx_1 > \"" >> /var/lib/awx/.bashrc'
          SET_PS1_RECEPTOR1='/usr/bin/echo "export PS1=\"receptor_1 > \"" >> /var/lib/awx/.bashrc'
          SET_PS1_RECEPTOR2='/usr/bin/echo "export PS1=\"receptor_2 > \"" >> /var/lib/awx/.bashrc'

          docker exec tools_awx_1 bash -c "$SET_PS1_AWX1"
          docker exec tools_receptor_1 bash -c "$SET_PS1_RECEPTOR1"
          docker exec tools_receptor_2 bash -c "$SET_PS1_RECEPTOR2"

          SET_RC_ALIAS='/usr/bin/echo "alias rc=\"receptorctl --socket /var/run/awx-receptor/receptor.sock\"" >> /var/lib/awx/.bashrc'

          docker exec tools_awx_1 bash -c "$SET_RC_ALIAS"
          docker exec tools_receptor_1 bash -c "$SET_RC_ALIAS"
          docker exec tools_receptor_2 bash -c "$SET_RC_ALIAS"
      }

      alias a1w='watch -n 3 docker exec tools_awx_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work list'
      alias r1w='watch -n 3 docker exec tools_receptor_1 receptorctl --socket /var/run/awx-receptor/receptor.sock work list'
      alias r2w='watch -n 3 docker exec tools_receptor_2 receptorctl --socket /var/run/awx-receptor/receptor.sock work list'

      alias a1wp='watch -n 5 docker exec tools_awx_1 podman ps'
      alias r1wp='watch -n 5 docker exec tools_receptor_1 podman ps'
      alias r2wp='watch -n 5 docker exec tools_receptor_2 podman ps'

    marker: "# {mark} ANSIBLE MANAGED BLOCK - awx"
  tags: awx

- name: Add .ignore file (for ag)
  copy:
    src: files/ag/dot_ignore
    dest: ~/git/awx/.ignore
  tags: awx
