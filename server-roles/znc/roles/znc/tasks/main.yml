# https://wiki.znc.in/Installation#Debian
- name: Install znc
  apt:
    name: znc
    state: latest
  become: true

# Install firewalld
# open port 50202
#
# - sudo apt install -y firewalld
# - sudo firewall-cmd --permanent --add-port=50202/tcp --zone=public
#   - should echo back 'success'
# - sudo firewall-cmd --reload
#   - should echo back 'success'
# - sudo firewall-cmd --list-all
#   - should list 'ports: 50202/tcp'
#   - (list may include other ports as well)

# Configure znc with:
# $ znc --makeconf
# - results in interactive prompts
# - listen on port: 50202
# - listen using SSL? yes
# - listen using both IPv4 and IPv6? yes (default)
# - creates Pem file (/home/pi/.znc/znc.pem)
# - username: pipsqueak
# - password (stored in playbooks/bootstrap/pipsqueak/znc-server)
# - set up a network? (yes)
#   - name: pipsqueak
#   - host: localhost
#   - use SSL? no (default)
#   - port? 6667 (default)
#   - password? (empty) (default)
#   - Initial channels: #home
# - Next, provides this hint:
#
#   > To connect to this ZNC you need to connect to it as your IRC server
#   > using the port that you supplied.  You have to supply your login info
#   > as the IRC server password like this: user/network:pass.
#   >
#   > Try something like this in your IRC client...
#   > /server <znc_server_ip> +50202 pipsqueak:<pass>
#   >
#   > To manage settings, users and networks, point your web browser to
#   > https://<znc_server_ip>:50202/
#
# - Launch znc now? yes
# - Launched ZNC 1.8.2+deb2 (https://znc.in)

#
# TODO: store this file in pass as a secret (?)
# and add task to create this file

# To run znc:
#
# (logged in as user jim)\
# $ znc
#
# No need to do anything to make this run in the background;
# it will handle this automatically

# To connect client
# - connect to 192.168.1.3
# - port: 50202
# - SSL: yes
# - nick: (ZNC username)
# - server password: (ZNC password)
# - join rooms: (any rooms configured in ZNC for user)

# To connect to webadmin
# * Tunnel to think w/:
#   ssh -L 50202:localhost:50202 jim@think
# * Point local browser to https://localhost:50202
# * Login with znc user creds (see jladd pass in  $(pass show playbooks/bootstrap/znc-server))
#
# From the webadmin you can:
# - create new users
# - for each user, create new servers, add new rooms to follow
#
# To switch from one server to another w/ ZNC:
# - join the ZNC server
# - send '/msg *status JumpNetwork <name of network>
#   where network name might be Think or libera (see networks defined in webadmin)
