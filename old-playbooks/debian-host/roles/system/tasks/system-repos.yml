# allow non-free system packages

# main packages
- lineinfile:
    path: /etc/apt/sources.list
    regexp: '^deb http://deb.debian.org/debian'
    line: 'deb http://deb.debian.org/debian bullseye main non-free'
  become: true
  tags: system_repos

- lineinfile:
    path: /etc/apt/sources.list
    regexp: '^deb-src http://deb.debian.org/debian'
    line: 'deb-src http://deb.debian.org/debian bullseye main non-free'
  become: true
  tags: system_repos

# security
- lineinfile:
    path: /etc/apt/sources.list
    regexp: '^deb http://security.debian.org/debian-security'
    line: 'deb http://security.debian.org/debian-security bullseye-security main non-free'
  become: true
  tags: system_repos

- lineinfile:
    path: /etc/apt/sources.list
    regexp: '^deb-src http://security.debian.org/debian-security'
    line: 'deb-src http://security.debian.org/debian-security bullseye-security main non-free'
  become: true
  tags: system_repos

# updates
- lineinfile:
    path: /etc/apt/sources.list
    regexp: '^deb http://deb.debian.org/debian'
    line: 'deb http://deb.debian.org/debian/ bullseye-updates main non-free'
  become: true
  tags: system_repos

- lineinfile:
    path: /etc/apt/sources.list
    regexp: '^deb-src http://deb.debian.org/debian'
    line: 'deb-src http://deb.debian.org/debian/ bullseye-updates main non-free'
  become: true
  tags: system_repos
