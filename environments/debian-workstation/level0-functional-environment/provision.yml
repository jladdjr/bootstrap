- hosts: all
  tasks:
    - name: Install essential packages
      apt:
        name:
          - apt-file
          - bc
          - calibre
          - curl
          - e2fsprogs
          - foot
          - fd-find
          - htop
          - info
          - jq
          - locate
          - openssh-server
          - rename
          - rsync
          - screen
          - strace
          - unison
          - vim
          - wget
          - yq
        state: latest
        update_cache: true
      become: true

- hosts: all
  roles:
    - { role: bash, tags: bash }
    - { role: git, tags: git }
    - { role: pass, tags: pass }
    - { role: tmux, tags: tmux}
