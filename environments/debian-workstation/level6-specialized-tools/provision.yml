- hosts: all
  roles:
    - { role: gimp, tags: gimp }
    - { role: latex, tags: latex }
    - { role: ledger, tags: ledger }
    - { role: texinfo, tags: texinfo }

- hosts: all
  tasks:
    - name: Install krita
      apt:
        name:
          - krita
          - screenkey # https://www.thregr.org/wavexx/software/screenkey/#installation-and-basic-usage 
        state: latest
        update_cache: true
      become: true
