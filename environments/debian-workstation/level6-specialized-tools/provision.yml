- hosts: all
  roles:
    - { role: gimp, tags: gimp }
    - { role: latex, tags: latex }
    - { role: ledger, tags: ledger }
    - { role: texinfo, tags: texinfo }

- hosts: all
  tasks:
    - name: Install krita
      apt:
        name:
          - krita
          - screenkey    # run with `screenkey --mods-mode emacs --persist`
          - slurp
          - wf-recorder  # run with `wf-recorder -g "$(slurp -d)"
        state: latest
        update_cache: true
      become: true
