- name: Install sway and friends
  apt:
    name:
      - sway
      - swaylock
      - swayidle
      - i3status
    state: latest
  become: true

- name: Ensure .sway dir present
  file:
    state: directory
    path: ~/.sway
    mode: 0755

- name: Install sway config
  copy:
    src: sway_config
    dest: ~/.sway/config
    mode: 0755
    backup: yes

# https://i3wm.org/docs/i3status.html
- name: Install i3status config
  copy:
    src: dot_i3status.conf
    dest: ~/.i3status.conf
    mode: 0755
    backup: yes
