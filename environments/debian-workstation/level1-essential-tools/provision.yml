- hosts: all
  roles:
    - { role: borg, tags: borg }
    - { role: emacs, tags: emacs }
    - { role: pass, tags: pass }
    # - { role: joplin, tags: joplin }
    - { role: syncthing, tags: syncthing }

- hosts: all
  tasks:
    - name: Install core tools
      apt:
        name:
          - dnsutils         # provides dig (for getting DNS record info)
          - dos2unix
          - ffmpeg           # video conversion
          - isc-dhcp-client  # provides dhclient (for reseting dhcp assignment)
          - jdupes           # for general de-duplication
          - lm-sensors       # provides sensors, for checking machine temps
          - mailutils        # provides mail (essential for reading cron mail)
          - traceroute
        state: latest
      become: true
