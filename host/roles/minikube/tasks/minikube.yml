---

# before running minikube for the first time, disable selinux
- name: Disable selinux (permanent)
  lineinfile:
    path: /etc/sysconfig/selinux
    regexp: '^SELINUX='
    line: SELINUX=disabled
  become: true

- name: Disable selinux (for current session)
  shell: setenforce 0
  become: true

# Per this comment (https://github.com/ansible/awx-operator/issues/548#issuecomment-920972288)
# it looks like Minikube v1.21.0 may be my best best (even though v1.23.0 is out)
# - installs /usr/bin/minikube
- name: Install Minikube v1.21.0
  dnf:
    name: 'https://github.com/kubernetes/minikube/releases/download/v1.21.0/minikube-1.21.0-0.x86_64.rpm'
    state: present
  become: true
