# As of 9/16/21, minikube requires Docker 18.09 or higher
# https://minikube.sigs.k8s.io/docs/drivers/docker/

# https://docs.docker.com/engine/install/rhel/#install-using-the-repository
# I wasn't able to use docker's repositories. When I went to install docker-ce
# it simply said that all repositories had been tried.

# https://linuxconfig.org/how-to-install-docker-in-rhel-8
#
# Install docker-ce
# sudo dnf config-manager --add-repo=https://download.docker.com/linux/centos/docker-ce.repo
# sudo dnf install docker-ce
#
# This installs:
# - docker-ce 3:20.10.8-3.el8 (using docker-ce-stable)
#       - tells systemctl to create docker.service
#       - creates `docker` group
# And installs the following requirements:
# - containerd.io:  1.4.9-3.1.el8 (docker-ce-stable)
#       - tells systemctl to create containerd.service
# - container-selinux: 2:2.164.1.1 (rhel-8-for-x86_64-appstream-rpms)
#       - sets se policy to 'targeted' for docker, container, gear
# - docker-ce-cli 1:20.10.8-3.el8 (docker-ce-stable)
# - docker-ce-rootless-extras 20.10.8-3.el8 (docker-ce-stable)
# - docker-scan-plugin (rhel-8-baseos-rhui-rpms)
# - fuse-common (rhel-8-appstream-rhui-rpms)
# - fuse-overlayfs 1.6-1 (rhel-8-baseos-rhui-rpms)
#       - modprobe fuse
# - fuse3 3.2.1-12.el8 (rhel-8-baseos-rhui-rpms)
# - fuse3-libs 3.2.1-12.el8 (rhel-8-baseos-rhui-rpms)
# - iptables (rhel-8-baseos-rhui-rpms)
#       - removes alternatives for iptables, ip6tables
#         before doing install
# - libcgroup 0.42-19.e08 (rhel-8-baseos-rhui-rpms)
#       - creates `cgred` group
# - libnetfilter_conntrack (rhel-8-baseos-rhui-rpms)
#       - runs /sbin/ldconfig
# - libnfnetlink (rhel-8-baseos-rhui-rpms)
# - libnftnl (rhel-8-baseos-rhui-rpms)
# - libslirp (rhel-8-appstream-rhui-rpms)
# - slirp4netns (rhel-8-appstream-rhui-rpms)

# minikube releases (w/ release notes)
# https://github.com/kubernetes/minikube/releases
#
# Per this comment (https://github.com/ansible/awx-operator/issues/548#issuecomment-920972288)
# it looks like Minikube v1.21.0 may be my best best (even though v1.23.0 is out)
#
# wget https://github.com/kubernetes/minikube/releases/download/v1.21.0/minikube-1.21.0-0.x86_64.rpm
# dnf install minikube-1.21.0-0.x86_64.rpm
# - installs /usr/bin/minikube
#
#
# Before running minikube for the first time, disable selinux:
#
# Edit vi /etc/sysconfig/selinux,
# set SELINUX=disabled (instead of enforcing)
#
# and run
# sudo setenforce 0

# Make docker the default driver
# minikube config set driver docker  # <--- this creates ~/.minikube for the first time

# Before starting docker for the first time, tell it to
# always let systemd manage cgroups
# https://lwn.net/Articles/676831/
# https://github.com/kubernetes/kubeadm/issues/1394#issuecomment-461443286
# https://docs.docker.com/engine/reference/commandline/dockerd/

# sudo mkdir /etc/docker
sudo cat > /etc/docker/daemon.json <<EOF
{
  "exec-opts": ["native.cgroupdriver=systemd"],
  "log-driver": "json-file",
  "log-opts": {
    "max-size": "100m"
  },
  "storage-driver": "overlay2"
}
EOF

# now we can start docker (and automatically start it in general)
systemctl start docker
systemctl enable docker

# calling systemctl enable docker created:
# /usr/lib/systemd/system/docker.service which had:

# [Unit]
# Description=Docker Application Container Engine
# Documentation=https://docs.docker.com
# After=network-online.target firewalld.service containerd.service
# Wants=network-online.target
# Requires=docker.socket containerd.service
# 
# [Service]
# Type=notify
# # the default is not to use systemd for cgroups because the delegate issues still
# # exists and systemd currently does not support the cgroup feature set required
# # for containers run by docker
# ExecStart=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock
# ExecReload=/bin/kill -s HUP $MAINPID
# TimeoutSec=0
# RestartSec=2
# Restart=always
# 
# # Note that StartLimit* options were moved from "Service" to "Unit" in systemd 229.
# # Both the old, and new location are accepted by systemd 229 and up, so using the old location
# # to make them work for either version of systemd.
# StartLimitBurst=3
# 
# # Note that StartLimitInterval was renamed to StartLimitIntervalSec in systemd 230.
# # Both the old, and new name are accepted by systemd 230 and up, so using the old name to make
# # this option work for either version of systemd.
# StartLimitInterval=60s
# 
# # Having non-zero Limit*s causes performance problems due to accounting overhead
# # in the kernel. We recommend using cgroups to do container-local accounting.
# LimitNOFILE=infinity
# LimitNPROC=infinity
# LimitCORE=infinity
# 
# # Comment TasksMax if your systemd version does not support it.
# # Only systemd 226 and above support this option.
# TasksMax=infinity
# 
# # set delegate yes so that systemd does not reset the cgroups of docker containers
# Delegate=yes
# 
# # kill only the docker process, not all processes in the cgroup
# KillMode=process
# OOMScoreAdjust=-500
# 
# [Install]
# WantedBy=multi-user.target

# I don't want to have to use sudo every time I call `docker run` so:
# https://docs.docker.com/engine/install/linux-postinstall/#manage-docker-as-a-non-root-user

sudo usermod -aG docker $USER
(log out, log back in)

